name: minimax-h3

description: MiniMax H3 text-to-video workflow with Pixaroma nodes

assets:
  - name: minimax-h3-diffusion
    type: model
    provider: huggingface
    repo: Comfy-Org/MiniMax-H3
    file: diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
    output: minimax_h3_fl2va_pruned_int8_convrot.safetensors
    destination: diffusion_models/h3
    check: minimax_h3_fl2va_pruned_int8_convrot.safetensors

  - name: qwen3vl-32b-minimax-h3
    type: model
    provider: huggingface
    repo: Comfy-Org/MiniMax-H3
    file: text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
    output: qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
    destination: text_encoders
    check: qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors

  - name: minimax-h3-video-vae
    type: model
    provider: huggingface
    repo: Comfy-Org/MiniMax-H3
    file: vae/minimax_h3_video_vae_fp16.safetensors
    output: minimax_h3_video_vae_fp16.safetensors
    destination: vae
    check: minimax_h3_video_vae_fp16.safetensors

  - name: minimax-h3-audio-vae
    type: model
    provider: huggingface
    repo: Comfy-Org/MiniMax-H3
    file: vae/minimax_h3_audio_vae_fp32.safetensors
    output: minimax_h3_audio_vae_fp32.safetensors
    destination: vae
    check: minimax_h3_audio_vae_fp32.safetensors

  - name: comfyui-pixaroma
    type: custom_node
    provider: git
    repo: https://github.com/pixaroma/ComfyUI-Pixaroma.git
    check: ComfyUI-Pixaroma
